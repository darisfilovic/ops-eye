# /data/nginx/custom/server_proxy.conf  (NPM includes it at the end of EVERY
# proxy host's server block, so it protects hosts added later as well).
#
# Scanners get 444: nginx closes the connection without a response, the
# request never reaches the application, and the access log still records
# it so the fail2ban jail npm-scanner can ban the address.
if ($ops_bad_bot) { return 444; }

# Files and paths that do not exist on an Odoo or Node host.
location ~* \.(php|phtml|asp|aspx|jsp|cgi|env|git|aws|htaccess|htpasswd|sql|bak|old)$ { return 444; }
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|phpmyadmin|pma|mysql|vendor/phpunit|\.git|\.env|\.aws|cgi-bin|owa|autodiscover) { return 444; }

# Odoo database manager stays private. list_db = False in odoo.conf already
# disables it; this keeps even the page from being served.
location ^~ /web/database { return 404; }

# Module static files (/<module>/static/...). Odoo serves them without a
# login. Refuse, for everyone and independently of Odoo, what a browser
# never needs from there: source code, scripts, settings, documentation
# and keys.
location ~* ^/[^/]+/static/.+\.(py|pyc|pyo|md|rst|sh|bash|bat|cmd|ps1|ini|cfg|conf|toml|ya?ml|sql|po|pot|log|bak|orig|dump|env|pem|key|crt|p12|pfx|example|sample|dist)$ { return 404; }

# Database service over XML-RPC: db_exist confirms database names to
# anyone who asks. Copy and drop are already off with list_db = False.
location ~ ^/xmlrpc/(2/)?db$ { return 404; }

# Odoo sends the session cookie without Secure and SameSite.
proxy_cookie_flags session_id secure samesite=lax;
# Links that carry a token (password reset, invitation, meeting) must not
# leak to other sites in the Referer header; Server must not name the
# software.
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
more_clear_headers Server;
