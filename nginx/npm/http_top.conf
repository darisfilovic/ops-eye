# /data/nginx/custom/http_top.conf  (Nginx Proxy Manager includes it at the
# top of the http block, before any server block).
#
# 1. gzip: NPM enables gzip but only for text/html, so every Odoo JavaScript
#    bundle (2 to 3 MB) and every JSON-RPC answer travels uncompressed.
gzip_types text/plain text/css text/xml text/javascript application/javascript
           application/json application/xml application/xml+rss image/svg+xml
           font/woff2 application/font-woff2 application/wasm;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;
gzip_proxied any;

# 2. rate limiting zones, used by the per-host Advanced configuration
#    ($binary_remote_addr: about 160,000 addresses fit in 10 MB).
limit_req_zone $binary_remote_addr zone=npm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=npm_general:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=npm_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# 3. scanners by User-Agent, used by server_proxy.conf. An empty User-Agent
#    is treated as a scanner too. python-requests, curl, wget and
#    Go-http-client are NOT on the list on purpose: integrations use them.
map $http_user_agent $ops_bad_bot {
    default 0;
    ""      1;
    "~*(zgrab|masscan|nmap|nikto|sqlmap|censys|shodan|nuclei|dirbuster|gobuster|wpscan|acunetix|netsparker|l9explore|expanse|paloaltonetworks|internet-measurement|zmeu|morfeus)" 1;
}
