# Advanced tab of an Odoo proxy host in Nginx Proxy Manager (per host; NPM
# regenerates the conf file from the database, so this text goes into the UI,
# not into a file). Assumes Odoo with workers > 0, HTTP on 8069 and the
# websocket (gevent) on 8072, and the zones from http_top.conf.
# Replace "web" with the name of the Odoo container on the NPM network.

# Websocket goes to the gevent port.
location = /websocket {
    proxy_pass http://web:8072;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 720s;
}

# Login: strict limit against password guessing (10 per minute per address).
location = /web/login {
    limit_req zone=npm_login burst=5 nodelay;
    include conf.d/include/proxy.conf;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
}
location = /web/session/authenticate {
    limit_req zone=npm_login burst=5 nodelay;
    include conf.d/include/proxy.conf;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
}

# Everything else. The timeouts must be at least limit_time_real from
# odoo.conf, otherwise nginx answers 504 while Odoo is still working on a
# long report or export.
location / {
    limit_req zone=npm_general burst=200 nodelay;
    limit_conn npm_conn 60;
    include conf.d/include/proxy.conf;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
}
