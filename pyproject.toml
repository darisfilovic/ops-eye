# Settings for the development tools. ops-eye itself needs only Python 3.10+
# and its standard library.

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
# S603/S607: every command runs as an argument list without a shell; the
# tools are found on PATH on purpose (docker, journalctl, fail2ban-client).
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and sample addresses such as 0.0.0.0 are data, not binds.
"tests/*" = ["S101", "S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
