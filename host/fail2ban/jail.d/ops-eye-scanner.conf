# /etc/fail2ban/jail.d/ops-eye-scanner.conf
# Scanners hitting Nginx Proxy Manager. The proxy runs in Docker, so the ban
# must go into the DOCKER-USER chain (action iptables-docker in action.d).
# bantime.increment in jail.local doubles the ban for repeat offenders.
[npm-scanner]
enabled   = true
filter    = npm-scanner
logpath   = __NPM_LOGS_DIR__/proxy-host-*_access.log
            __NPM_LOGS_DIR__/fallback_http_access.log
action    = iptables-docker[name=npmscanner]
maxretry  = 2
findtime  = 1h
bantime   = 1d

# Same scanners on the default site (bare IP address), combined log format.
[npm-default-scanner]
enabled   = true
filter    = npm-default-scanner
logpath   = __NPM_LOGS_DIR__/default-host_access.log
action    = iptables-docker[name=npmdefault]
maxretry  = 2
findtime  = 1h
bantime   = 1d
