# Requests that reached the default site of Nginx Proxy Manager (bare IP,
# unknown Host). Its access log uses the standard "combined" format:
#   1.2.3.4 - - [13/Sep/2026:10:00:00 +0000] "GET /.env HTTP/1.1" 444 0 "-" "UA"
[Definition]
failregex = ^<HOST> - \S+ \[\] "(?:GET|POST|HEAD|PUT|OPTIONS|PROPFIND) [^"]*(?:\.php|\.env|\.git|\.aws|/wp-|xmlrpc\.php|phpmyadmin|/vendor/phpunit|/cgi-bin/)[^"]*" \d{3}
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
