# Requests for files and paths that never exist on an Odoo or Node host:
# PHP, .env, .git, WordPress, phpMyAdmin. Two of these in an hour is a scanner.
#
# Works for both Nginx Proxy Manager access log formats:
#   [date] - 404 404 - GET https host "/wp-login.php" [Client 1.2.3.4] ...   (proxy hosts)
#   [date] - - 444 - GET https host "/.env" [Client 1.2.3.4] ...             (proxy hosts, nginx answered itself)
#   [date] 200 - GET http 1.2.3.4 "/.env" [Client 1.2.3.4] ...               (fallback)
# The upstream status is "-" whenever nginx answers without asking the
# application, which is exactly the case for the 444 rules in
# nginx/npm/server_proxy.conf.
# fail2ban strips the date before matching and leaves the timezone, so the
# regex is not anchored at the start of the line.
[Definition]
failregex = \] (?:\S+ (?:\d{3}|-) )?\d{3} - \S+ \S+ \S+ "[^"]*(?:\.php|\.env|\.git|\.aws|/wp-|xmlrpc\.php|phpmyadmin|/vendor/phpunit)[^"]*" \[Client <HOST>\]
ignoreregex =
datepattern = ^\[%%d/%%b/%%Y:%%H:%%M:%%S
