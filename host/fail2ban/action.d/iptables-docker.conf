# Ban action for services that run in Docker containers.
#
# The stock fail2ban actions insert their rules into the INPUT chain, but
# traffic to a published container port goes through PREROUTING and
# FORWARD and never reaches INPUT. The ban shows up in
# "fail2ban-client status" while the address keeps getting through.
# This action writes into DOCKER-USER, the chain Docker evaluates before
# its own rules.

[Definition]

actionstart = <iptables> -N f2b-<name> 2>/dev/null || true
              <iptables> -A f2b-<name> -j RETURN 2>/dev/null || true
              <iptables> -I DOCKER-USER 1 -j f2b-<name>

actionstop = <iptables> -D DOCKER-USER -j f2b-<name>
             <iptables> -F f2b-<name>
             <iptables> -X f2b-<name>

actioncheck = <iptables> -n -L DOCKER-USER | grep -q 'f2b-<name>[ \t]'

actionban = <iptables> -I f2b-<name> 1 -s <ip> -j DROP

actionunban = <iptables> -D f2b-<name> -s <ip> -j DROP

[Init]
name = default
iptables = iptables -w
