# /etc/ssh/sshd_config.d/ops-eye.conf
# NOT applied by install-host-configs.sh. Apply by hand only after a key
# login has been confirmed in the journal ("Accepted publickey"), while
# the current session stays open:
#   cp host/sshd/ops-eye.conf /etc/ssh/sshd_config.d/ && sshd -t && systemctl reload ssh
PasswordAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
KbdInteractiveAuthentication no
